stages:
  - test
  - build

backend-test:
  stage: test
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir -r backend/requirements.txt
  script:
    - PYTHONPATH=backend pytest -q backend/tests

ocr-test:
  stage: test
  image: python:3.13-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends tesseract-ocr
    - pip install --no-cache-dir -r backend/requirements.txt
  script:
    - PYTHONPATH=backend pytest -q backend/tests/test_ocr_engine.py

data-snapshot-test:
  stage: test
  image: python:3.13-slim
  variables:
    SEED_DEMO_ON_EMPTY: "false"
  before_script:
    - pip install --no-cache-dir -r backend/requirements.txt
  script:
    - PYTHONPATH=backend python scripts/validate_public_data.py

frontend-test:
  stage: test
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run test:unit
    - npm run test:sites

frontend-build:
  stage: build
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days
