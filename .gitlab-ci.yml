stages:
  - test
  - build

backend-test:
  stage: test
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir -r backend/requirements.txt
  script:
    - PYTHONPATH=backend pytest -q backend/tests

frontend-test:
  stage: test
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run test:unit
    - npm run test:sites

frontend-build:
  stage: build
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days
