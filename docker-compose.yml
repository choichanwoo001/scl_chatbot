services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: true
    # Docker runs the API against the external Supabase database.
    # Production validation rejects the default SQLite URL and missing encryption key.
    environment:
      APP_ENV: production
      SEED_DEMO_ON_EMPTY: "false"
      MIGRATION_DATABASE_URL: ""
      INGEST_DATABASE_URL: ""
      SUPABASE_DB_PASSWORD: ""
    ports:
      - "8000:8000"
    volumes:
      # Attachment files, indexes, and preserved source backups.
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
